<style>
:root{--bg:#000;--ink:#F4F3EF;--mute:#9A9A9A;--line:#2E2E2E;--ph:#1A1A1A;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.en{font-family:'Inter Tight',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.wrap{max-width:1120px;margin:0 auto}
header .title{margin:0;padding:24px 12px 14px;font-size:min(19vw,120px);line-height:.98;font-weight:700;letter-spacing:-.07em;white-space:nowrap}
header .title .en{letter-spacing:-.075em}
.status{padding:8px 16px 14px;display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:500;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.status .row{display:flex;justify-content:space-between}
.status .left{color:var(--mute)}
.bar{height:6px;background:var(--line);display:flex}
.bar span{height:100%;background:var(--ink);transition:width .4s}
nav.chips{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
nav.chips::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:inherit;font-family:'Inter Tight',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;min-height:48px;padding:0;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--mute)}
.tab[aria-pressed=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tab sup{font-family:'Inter Tight',sans-serif;font-size:10px;font-weight:500;margin-left:2px;color:var(--mute)}
.hide-sold{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;min-height:48px;padding:0 0 0 8px;border:0;background:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.hide-sold .box{width:16px;height:16px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center}
.hide-sold[aria-pressed=true] .box{background:var(--ink)}
main{padding:24px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:56px 24px}
article{display:flex;flex-direction:column;gap:14px;min-width:0;}
.media{position:relative;aspect-ratio:4/5;background:var(--ph);overflow:hidden}
@media (max-width:767px){.media{margin:0 -16px}}
.track{display:flex;width:100%;height:100%;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track button{flex:0 0 100%;height:100%;scroll-snap-align:start;padding:0;border:0;background:none;cursor:zoom-in}
.track img{width:100%;height:100%;object-fit:cover;display:block}
.cond{position:absolute;left:12px;top:12px;font-size:11px;font-weight:500;padding:4px 8px;background:var(--bg);pointer-events:none}
.dots{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:4px;pointer-events:none}
.dots span{flex:1 1 0;height:2px;background:rgba(244,243,239,.3);transition:background .2s}
.dots span.on{background:var(--ink)}
.arr{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:0;background:rgba(244,243,239,.92);display:none;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
.arr.prev{left:10px}.arr.next{right:10px}
.arr[disabled]{visibility:hidden}
@media (hover:hover) and (pointer:fine){.arr{display:flex}.media:hover .arr{opacity:1}}
.arr:focus-visible{opacity:1;outline:2px solid var(--ink);outline-offset:2px}
.cnt{position:absolute;right:12px;top:12px;font-family:'Inter Tight',sans-serif;font-size:11px;font-weight:500;padding:4px 8px;background:rgba(0,0,0,.6);color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.sold-veil{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;pointer-events:none}
.sold-veil span{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--bg);background:var(--ink);padding:9px 18px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head .l{display:flex;align-items:baseline;gap:10px;min-width:0}
.no{font-family:'Inter Tight',sans-serif;font-size:12px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.name{font-size:16px;font-weight:500;letter-spacing:-.01em;word-break:keep-all}
.price{font-family:'Inter Tight',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.price.ask{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;font-weight:500;color:var(--mute)}
.is-sold .name,.is-sold .price{color:var(--mute)}
.is-sold .price{text-decoration:line-through}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.spec div{background:var(--bg);padding:8px 0 8px 10px;display:flex;flex-direction:column;gap:3px}
.spec div:first-child{padding-left:0}
.spec .k{font-size:11px;color:var(--mute)}
.spec .v{font-family:'Inter Tight',sans-serif;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.spec .k em{font-style:normal;color:var(--ink);margin-right:4px}
.more{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.empty{padding:80px 0;text-align:center;color:var(--mute);font-size:14px}
.foot{margin:56px 0 0;font-size:12px;color:var(--mute);text-align:center;line-height:1.7}
.cta{position:sticky;bottom:0;z-index:6;background:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.cta a{width:100%;max-width:560px;min-height:54px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);text-decoration:none;font-size:15px;font-weight:500}
.cta a.off{background:var(--line);color:var(--mute);pointer-events:none}
.lb{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
.lb.open{display:flex}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;color:#F4F3EF;font-size:13px}
.lb .top .en{font-variant-numeric:tabular-nums}
.lb .x{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lb .ltrack{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb .ltrack::-webkit-scrollbar{display:none}
.lb .ltrack div{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:0 0 16px}
.lb .ltrack img{max-width:100%;max-height:100%;object-fit:contain}
.lb .bottom{display:flex;align-items:center;justify-content:center;gap:20px;padding:0 16px calc(16px + env(safe-area-inset-bottom));color:#F4F3EF;font-size:14px}
.lb .bottom button{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lb .bottom button[disabled]{opacity:.25}
.lb .bottom .nm{min-width:120px;text-align:center}
</style>

<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var CHAT=D.chat||'';
var items=D.items;
var CATS=['상의','아우터','셋업','원피스','하의','악세사리'];
var CAT_EN={'all':'All','상의':'Tops','아우터':'Outerwear','셋업':'Sets','원피스':'Dresses','하의':'Bottoms','악세사리':'Accessories'};
var LABELS={'상의':['가슴','총장'],'아우터':['가슴','총장'],'셋업':['가슴','총장'],'원피스':['허리','총장'],'하의':['허리','총장'],'악세사리':['가로','세로']};
var state={cat:'all',hideSold:false};
function pad(n){return n<10?'0'+n:''+n}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){return /^\d+(\.\d+)?$/.test(String(v||'').trim())?String(v).trim():''}
function won(p){return p?'₩'+p.toLocaleString('ko-KR'):''}

// status
var sold=items.filter(function(i){return i.sold}).length;
document.getElementById('sold').textContent='SOLD '+pad(sold);
document.getElementById('left').textContent='LEFT '+pad(items.length-sold);
document.getElementById('barfill').style.width=(items.length?Math.round(sold/items.length*100):0)+'%';
document.getElementById('bar').setAttribute('aria-label','전체 '+items.length+'벌 중 '+sold+'벌 판매완료');

var cta=document.getElementById('cta');
if(CHAT){cta.href=CHAT}else{cta.classList.add('off');cta.removeAttribute('href');cta.querySelector('span').textContent='구매 문의 링크 준비 중'}

function specHtml(it){
  var L=LABELS[it.cat]||['치수1','치수2'];
  var cells=['<div><span class="k">사이즈</span><span class="v">'+esc(it.size||'-')+'</span></div>'];
  var a=num(it.m1),b=num(it.m2);
  var rows='';
  if(it.cat==='셋업'){
    var sw=num(it.sw),sl=num(it.sl);
    var top='<div class="spec">'+cells[0]+'<div><span class="k"><em>상의</em>가슴</span><span class="v">'+(a||'-')+'</span></div><div><span class="k"><em>상의</em>총장</span><span class="v">'+(b||'-')+'</span></div></div>';
    if(sw||sl){top+='<div class="spec" style="border-top:0"><div></div><div><span class="k"><em>하의</em>허리</span><span class="v">'+(sw||'-')+'</span></div><div><span class="k"><em>하의</em>총장</span><span class="v">'+(sl||'-')+'</span></div></div>'}
    return top;
  }
  if(a||b){cells.push('<div><span class="k">'+L[0]+'</span><span class="v">'+(a||'-')+'</span></div>','<div><span class="k">'+L[1]+'</span><span class="v">'+(b||'-')+'</span></div>')}
  else{cells.push('<div></div>','<div></div>')}
  return '<div class="spec">'+cells.join('')+'</div>';
}

function card(it,idx){
  var n=it.photos.length;
  var imgs=it.photos.map(function(p,k){
    return '<button type="button" data-open="'+idx+'" data-k="'+k+'" aria-label="'+esc(it.name)+' 사진 '+(k+1)+' 크게 보기"><img data-src="'+p.s+'" alt="" decoding="async"></button>';
  }).join('');
  var dots=n>1?'<div class="dots">'+it.photos.map(function(_,k){return '<span'+(k===0?' class="on"':'')+'></span>'}).join('')+'</div>':'';
  var arrows=n>1?'<button type="button" class="arr prev" aria-label="이전 사진"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button type="button" class="arr next" aria-label="다음 사진"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>':'';
  var price=it.price?'<span class="price">'+won(it.price)+'</span>':'<span class="price ask">가격 문의</span>';
  var link=it.link?'<a class="more" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">상품 정보 보기 ↗</a>':'';
  return '<article class="'+(it.sold?'is-sold':'')+'" data-idx="'+idx+'"><div class="media"><div class="track">'+imgs+'</div>'+(it.cond?'<span class="cond">'+esc(it.cond)+'</span>':'')+dots+(n>1?'<span class="cnt">1/'+n+'</span>':'')+arrows+(it.sold?'<div class="sold-veil"><span>판매완료</span></div>':'')+'</div>'+
    '<div class="head"><div class="l"><span class="no">'+esc(it.no)+'</span><span class="name">'+esc(it.name)+'</span></div>'+price+'</div>'+specHtml(it)+link+'</article>';
}

function visible(){return items.filter(function(i){return (state.cat==='all'||i.cat===state.cat)&&!(state.hideSold&&i.sold)})}

function renderTabs(){
  var pool=items.filter(function(i){return !(state.hideSold&&i.sold)});
  var defs=[['all',CAT_EN.all]].concat(CATS.filter(function(c){return items.some(function(i){return i.cat===c})}).map(function(c){return [c,CAT_EN[c]||c]}));
  var h=defs.map(function(d){var c=d[0]==='all'?pool.length:pool.filter(function(i){return i.cat===d[0]}).length;return '<button type="button" class="tab" data-cat="'+d[0]+'" aria-pressed="'+(state.cat===d[0])+'">'+d[1]+'<sup>'+c+'</sup></button>'}).join('');
  h+='<button type="button" class="hide-sold" id="hs" aria-pressed="'+state.hideSold+'"><span class="box"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>판매완료 제외</button>';
  document.getElementById('tabs').innerHTML=h;
}
function renderGrid(){
  var v=visible();
  var g=document.getElementById('grid');
  g.innerHTML=v.length?v.map(function(it){return card(it,items.indexOf(it))}).join(''):'<p class="empty">해당하는 상품이 없어요.</p>';
  g.querySelectorAll('.track').forEach(bindTrack);
  // load extra photos only for cards near the screen, and free them again when far away (keeps mobile memory low)
  var lazy=g.querySelectorAll('article');
  if(io){io.disconnect();lazy.forEach(function(a){io.observe(a)})}
  else{g.querySelectorAll('img[data-src]').forEach(function(im){im.src=im.dataset.src})}
}
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){
  var t=e.target.querySelector('.track');if(e.isIntersecting&&t&&t._fix)t._fix();
  if(e.isIntersecting){e.target._near=1;loadImgs(e.target,!e.target._all)}
  else{e.target._near=0;e.target._all=0;e.target.querySelectorAll('img[src]').forEach(function(im){im.removeAttribute('src')})}
  })},{rootMargin:'300px 0px'}):null;
function loadImgs(art,coverOnly){art.querySelectorAll(coverOnly?'button[data-k="0"] img[data-src]':'img[data-src]').forEach(function(im){/*noimg*/})}
function loadAll(art){if(art._all)return;art._all=1;loadImgs(art,false)}
function render(){renderTabs();renderGrid()}

function bindTrack(tr){
  var art=tr.closest('article');var dots=art.querySelectorAll('.dots span');
  var prev=art.querySelector('.arr.prev'),next=art.querySelector('.arr.next'),cnt=art.querySelector('.cnt');
  var n=tr.children.length;
  if(n<2)return;
  // infinite loop: clone last slide before the first and first slide after the last
  var head=tr.lastElementChild.cloneNode(true),tail=tr.firstElementChild.cloneNode(true);
  head.setAttribute('aria-hidden','true');tail.setAttribute('aria-hidden','true');head.tabIndex=-1;tail.tabIndex=-1;
  tr.insertBefore(head,tr.firstElementChild);tr.appendChild(tail);
  function w(){return tr.clientWidth}
  function pos(){return Math.round(tr.scrollLeft/w())}
  function real(){return ((pos()-1)%n+n)%n}
  function jump(i){tr._pt=Date.now();tr.style.scrollSnapType='none';tr.scrollLeft=i*w();tr.offsetWidth;tr.style.scrollSnapType=''}
  jump(1);tr._fix=function(){if(tr.scrollLeft<1){jump(1);upd()}};
  function upd(){var i=real();dots.forEach(function(d,k){d.classList.toggle('on',k===i)});if(cnt)cnt.textContent=(i+1)+'/'+n}
  function settle(){var p=pos();if(p===0)jump(n);else if(p===n+1)jump(1);upd()}
  var t;tr.addEventListener('scroll',function(){if(Date.now()-(tr._pt||0)>250)loadAll(art);clearTimeout(t);t=setTimeout(settle,120)},{passive:true});
  function all(){loadAll(art)}
  tr.addEventListener('touchstart',all,{passive:true});art.querySelector('.media').addEventListener('pointerenter',all);
  function go(d){all();tr.scrollTo({left:(pos()+d)*w(),behavior:'smooth'})}
  if(prev){prev.onclick=function(){go(-1)};next.onclick=function(){go(1)}}
}

document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='hs'){state.hideSold=!state.hideSold}else{state.cat=b.dataset.cat}
  render();
});

// lightbox
var lb=document.getElementById('lb'),lt=document.getElementById('lbTrack'),lbIt=null,lastFocus=null;
function lbCur(){return Math.round(lt.scrollLeft/lt.clientWidth)}
function lbUpd(){if(!lbIt)return;var i=lbCur(),n=lbIt.photos.length;document.getElementById('lbCount').textContent=pad(i+1)+' / '+pad(n);document.getElementById('lbPrev').disabled=i===0;document.getElementById('lbNext').disabled=i===n-1}
function openLb(idx,k){
  lbIt=items[idx];lastFocus=document.activeElement;
  lt.innerHTML=lbIt.photos.map(function(p){return '<div><img src="'+p.l+'" alt="" loading="lazy" decoding="async"></div>'}).join('');
  document.getElementById('lbName').textContent=lbIt.name;
  lb.classList.add('open');document.body.style.overflow='hidden';
  requestAnimationFrame(function(){lt.scrollLeft=k*lt.clientWidth;lbUpd()});
  document.getElementById('lbClose').focus();
}
function closeLb(){lb.classList.remove('open');document.body.style.overflow='';lt.innerHTML='';lbIt=null;if(lastFocus)lastFocus.focus()}
document.getElementById('grid').addEventListener('click',function(e){var b=e.target.closest('[data-open]');if(b)openLb(+b.dataset.open,+b.dataset.k)});
document.getElementById('lbClose').onclick=closeLb;
document.getElementById('lbPrev').onclick=function(){lt.scrollTo({left:(lbCur()-1)*lt.clientWidth,behavior:'smooth'})};
document.getElementById('lbNext').onclick=function(){lt.scrollTo({left:(lbCur()+1)*lt.clientWidth,behavior:'smooth'})};
var lto;lt.addEventListener('scroll',function(){clearTimeout(lto);lto=setTimeout(lbUpd,60)},{passive:true});
lb.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')document.getElementById('lbPrev').click();if(e.key==='ArrowRight')document.getElementById('lbNext').click()});

render();
})();
</script>
</body>
</html>
